services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: sonda_owner
      POSTGRES_PASSWORD: ${SONDA_DEV_PASSWORD:?Set an ephemeral development password}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonda_owner -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
    # Disposable development data; no production volume or deployment configuration.
    tmpfs:
      - /var/lib/postgresql
